[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novaarb"
version = "0.9.0"
description = "Research-first multi-market arbitrage and price-dislocation engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "NovaArb"}]
dependencies = [
  "websockets>=13.1,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
novaarb = "novaarb.cli:main"
novaarb-capture-report = "novaarb.capture_health:main"
novaarb-report = "novaarb.research_report:main"
novaarb-fee-report = "novaarb.fee_sensitivity:main"
novaarb-funding-scan = "novaarb.funding_cli:main"
novaarb-funding-replay = "novaarb.funding_replay_cli:main"
novaarb-synthetic-scan = "novaarb.synthetic_cli:main"
novaarb-cross-venue-scan = "novaarb.cross_venue_cli:main"
novaarb-cross-venue-replay = "novaarb.cross_venue_replay_cli:main"
novaarb-venue-health = "novaarb.venue_health_cli:main"
novaarb-shadow-replay = "novaarb.shadow_portfolio_cli:main"
novaarb-shadow-run = "novaarb.shadow_live_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["novaarb"]
