name: One-time artifact cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-artifact-cleanup.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete all existing workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            count=$((count + 1))
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[].id'
          )
          echo "Deleted artifacts: $count"
